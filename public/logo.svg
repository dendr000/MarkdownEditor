<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3f6"/>
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24292f"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#2da44e"/>
    </linearGradient>
  </defs>
  <!-- 여백을 줄이고 캔버스를 꽉 채우는 외곽 배경 -->
  <rect x="5" y="5" width="90" height="90" rx="16" fill="url(#bgGrad)" stroke="#d0d7de" strokeWidth="8" />
  
  <!-- 좌측 다크 사이드바 영역 -->
  <path d="M 5 21 C 5 12.163 12.163 5 21 5 L 35 5 L 35 95 L 21 95 C 12.163 95 5 87.837 5 79 Z" fill="url(#sidebarGrad)" />
  <circle cx="20" cy="25" r="5" fill="#ffffff" />
  <circle cx="20" cy="50" r="5" fill="#ffffff" />
  <circle cx="20" cy="75" r="5" fill="#ffffff" />
  
  <!-- 두께를 10으로 키운 그라데이션 체크마크 -->
  <path d="M 45 40 L 58 53 L 80 28" stroke="url(#checkGrad)" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round" fill="none" />
  
  <!-- 훨씬 굵고 명확해진 텍스트 라인 -->
  <line x1="45" y1="70" x2="80" y2="70" stroke="#8c959f" strokeWidth="8" strokeLinecap="round" />
  <line x1="45" y1="85" x2="65" y2="85" stroke="#8c959f" strokeWidth="8" strokeLinecap="round" />
</svg>
